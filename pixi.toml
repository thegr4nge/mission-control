[workspace]
authors = ["Edan <thegr4nge@users.noreply.github.com>"]
channels = ['conda-forge']
name = "mission-control"
platforms = ['win-64']
version = "0.1.0"

[tasks]
test = "pytest -v"
lambert-check = "python -m physics.lambert_check"
mcp-server = "python -m mcp_server.server"
eval = "python -m evals.run_eval"

[dependencies]
python = "3.12.*"
pykep = ">=3.1"
pytest = ">=9.2.0,<10"
mcp = ">=2.3.0,<3"
pygmo = ">=2.20.0,<3"
httpx = ">=0.28.1,<0.29"
